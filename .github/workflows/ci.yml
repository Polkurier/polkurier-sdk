name: CI

on:
  push:
    branches: [main, develop, '1.x']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [locked]
        # composer install resolves from the lock file, so the job below is the one that builds
        # the oldest releases symfony/serializer, guzzle and the PSR packages allow.
        include:
          - php: '8.3'
            dependencies: lowest

    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install the oldest allowed dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Static analysis
        run: composer analyse

      # The integration suite skips itself unless POLKURIER_API_URL is set, so CI runs unit only.
      - name: Tests
        run: composer test
